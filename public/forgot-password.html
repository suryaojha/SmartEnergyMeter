<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Forgot Password</title><link rel="stylesheet" href="/css/style.css"></head><body class="login-page"><div class="login-box"><h1>Forgot Password</h1><p class="muted">Enter your account email.</p><form id="forgotForm"><div class="field"><label>Email</label><input id="email" type="email" required></div><button class="btn" type="submit">Create Reset Link</button></form><p id="msg" class="muted"></p><a class="link" href="/login.html">Back to login</a></div><script>document.getElementById("forgotForm").onsubmit=async e=>{e.preventDefault();const msg=document.getElementById("msg");msg.textContent="Creating...";try{const r=await fetch("/api/auth/forgot-password",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:document.getElementById("email").value})});const d=await r.json();msg.innerHTML=d.resetLink?`${d.message}<br><br><a class="link" href="${d.resetLink}">Open password reset page</a>`:d.message}catch{msg.textContent="Request failed"}}</script></body></html>
