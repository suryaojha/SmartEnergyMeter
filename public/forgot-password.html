<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forgot password | Smart Energy Meter</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="login-page">
  <main class="login-box">
    <h1>Forgot password?</h1>
    <p class="muted">We’ll email a six-digit, one-time code if the account exists.</p>
    <form id="forgotForm">
      <div class="field"><label for="email">Account email</label><input id="email" type="email" autocomplete="email" required></div>
      <button id="sendCode" class="btn" type="submit">Email reset code</button>
    </form>
    <p id="msg" class="muted" role="status"></p>
    <a class="link" href="/login.html">Back to login</a>
  </main>
  <script src="/js/forgot-password.js"></script>
</body>
</html>
