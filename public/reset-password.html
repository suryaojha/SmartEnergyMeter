<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset Password</title><link rel="stylesheet" href="/css/style.css"></head><body class="login-page"><div class="login-box"><h1>Reset Password</h1><form id="resetForm"><div class="field"><label>New password</label><input id="password" type="password" minlength="6" required></div><div class="field"><label>Confirm password</label><input id="confirm" type="password" minlength="6" required></div><button class="btn" type="submit">Reset Password</button></form><p id="msg" class="muted"></p><a class="link" href="/login.html">Go to login</a></div><script>document.getElementById("resetForm").onsubmit=async e=>{e.preventDefault();const p=document.getElementById("password").value,c=document.getElementById("confirm").value,msg=document.getElementById("msg");if(p!==c){msg.textContent="Passwords do not match";return}const token=new URLSearchParams(location.search).get("token");const r=await fetch("/api/auth/reset-password",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token,password:p})});const d=await r.json();msg.textContent=d.message}</script></body></html>
