<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset password | Smart Energy Meter</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="login-page">
  <main class="login-box">
    <div class="logo">🔒</div>
    <h1>Reset password</h1>
    <p class="muted">Enter the six-digit code sent to your email and choose a new password.</p>
    <form id="resetForm">
      <div class="field"><label for="email">Account email</label><input id="email" type="email" autocomplete="email" required></div>
      <div class="field"><label for="code">Six-digit email code</label><input id="code" class="otp-input" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required></div>
      <div class="field"><label for="password">New password</label><input id="password" type="password" minlength="8" autocomplete="new-password" required></div>
      <div class="field"><label for="confirm">Confirm new password</label><input id="confirm" type="password" minlength="8" autocomplete="new-password" required></div>
      <button class="btn" type="submit">Reset password</button>
    </form>
    <p id="msg" class="status-text" role="status"></p>
    <a class="link" href="/forgot-password.html">Request another code</a>
  </main>
  <script src="/js/reset-password.js"></script>
</body>
</html>
