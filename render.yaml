services:
  - type: web
    name: smart-energy-meter
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: energyMeterDB
      - key: JWT_SECRET
        generateValue: true
      - key: WIFI_CONFIG_KEY
        generateValue: true
      - key: SMTP_CONFIG_KEY
        generateValue: true
